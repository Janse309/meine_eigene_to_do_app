<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

    <link rel="stylesheet" href="../styles/standart.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/assets.css">
    <link rel="stylesheet" href="../styles/fonts.css">

    <script src="../scripts/firebase.js"></script>
    <script src="../script.js" defer></script>
    <script src="../scripts/db.js"></script>
    <script src="../scripts/template.js"></script>
</head>

<body onload="init()">

    <header class="page-header">
        <h1 class="page-headline">To-do's made simple</h1>
    </header>

    <main class="board-main">
        <div id="msgBox"></div>

        <div class="task-input-container">
            <form id="form">
                <input class="task-input" id="task-input" type="text" required minlength="4">
                <button class="btn submit-btn" type="submit">add to task</button>
            </form>
        </div>

        <div class="board-section-wrapper content-wrapper">

            <section class="taskboard-content-container">
                <h2 class="card-container-heading">To do</h2>
                <div id="to-dos" class="taskboard-content drag-area" ondragover="allowDrop(event)" ondrop="dropElement(event, 'to-dos')"></div>
            </section>

            <section>
                <h2 class="card-container-heading">In progress</h2>
                <div id="in-progress" class="category-container drag-area" ondragover="allowDrop(event)" ondrop="dropElement(event, 'in-progress')"></div>
            </section>

            <section>
                <h2 class="card-container-heading">Await Feedback</h2>
                <div id="await-feedback" class="taskboard-content drag-area" ondragover="allowDrop(event)" ondrop="dropElement(event, 'await-feedback')"></div>
            </section>

            <section>
                <h2 class="card-container-heading">Done</h2>
                <div id="done" class="taskboard-content drag-area" ondragover="allowDrop(event)" ondrop="dropElement(event, 'done')"></div> <!--hier werden die drag Funktionen reingeschrieben-->
            </section>
        </div>

    </main>

    <footer></footer>

</body>

</html>

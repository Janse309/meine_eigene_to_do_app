<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do Liste</title>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">

    <link rel="stylesheet" href="../styles/standart.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../styles/assets.css">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/fonts.css">

    <script src="../scripts/firebase.js"></script>
    <script src="../script.js" defer></script>
    <script src="../scripts/db.js"></script>
    <script src="../scripts/template.js"></script>
</head>

<body onload="init()">

    <header class="login-header">
        <h1 class="to-do-headline">To-do's made simple</h1>
    </header>

    <main class="to-do-main">
        <div id="msgBox"></div>

        <div class="main-content-container">
            <form id="form">
                <input class="task-input" id="task-input" type="text" required minlength="4">
                <button class="btn btn-font submit-btn" type="submit">add to task</button>
            </form>
        </div>

        <div class="task-board-container">
            <div class="content-area" id="content-area"></div>
        </div>

    </main>

    <footer>logout</footer>

</body>

</html>

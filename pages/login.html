<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>

    <link rel="stylesheet" href="../styles/standart.css">
    <link rel="stylesheet" href="../styles/login.css">
    <link rel="stylesheet" href="../styles/fonts.css">
    <link rel="stylesheet" href="../styles/assets.css">
    <link rel="stylesheet" href="../style.css">

    <script src="../scripts/login.js" defer></script>
    <script src="../scripts/db.js" defer></script>
</head>


<body>

    <header class="login-header">
        <h1 class="to-do-headline">To-do's made simple</h1>
    </header>

    <main class="login-main">

        <section class="log-in-section">
            <h2>Logge dich ein oder Registriere dich</h2>

            <form class="log-in-form" onsubmit="login(); return false;">
                <h3>Login</h3>
                <input type="email" id="email" required placeholder="E-Mail">
                <input type="password" id="password" required placeholder="Passwort">
                <div>
                    <button class="login-btn btn">Sign in</button>
                    <button onclick="loginAsGuest()" class="register-btn btn">Gastzugang</button>
                </div>
            </form>

            <div>
                <p class="continue">or continue with</p>
                <button class="btn"><img src="../assets/icons/google-icon.svg" alt="google"></button>
                <button class="btn"><img src="../assets/icons/git-hub-icon.svg" alt="github"></button>
                <button class="btn"><img src="../assets/icons/facebook-icon.svg" alt="facebook"></button>
            </div>

            <div class="register-btn-section">
                <p>Don't have an account yet ? <a href="./register.html">Register for free</a></p>
            </div>

        </section>

    </main>

    <div id="msgBox"></div>

</body>

</html>
